<!-- Barre de recherche -->
<form method="get">
    <input type="text" name="q" placeholder="Filtrer par nom..." value="{{ request.GET.q }}">
    <button type="submit">Rechercher</button>
</form>

<ul>
    {% for role in roles %}
    <li>
        {{ role.name }}
        <a href="{% url 'administration:role_detail' role.id %}">Gérer</a>
    </li>
    {% endfor %}
</ul>

<!-- Pagination -->
{% if is_paginated %}
<div class="pagination">
    {% if page_obj.has_previous %}
    <a href="?page={{ page_obj.previous_page_number }}{% if request.GET.q %}&q={{ request.GET.q }}{% endif %}">Précédent</a>
    {% endif %}

    <span>Page {{ page_obj.number }} sur {{ page_obj.paginator.num_pages }}</span>

    {% if page_obj.has_next %}
    <a href="?page={{ page_obj.next_page_number }}{% if request.GET.q %}&q={{ request.GET.q }}{% endif %}">Suivant</a>
    {% endif %}
</div>
{% endif %}
