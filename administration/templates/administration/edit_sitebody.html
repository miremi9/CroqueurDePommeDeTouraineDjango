{% extends "base.html" %}

{% load crispy_forms_tags %}
{% load static %}
{% block content %}

<div class="py-5">
    <div class="container">
        <div class="card shadow-sm mx-auto" style="max-width: 850px;">
            <div class="card-body p-4">

                <h1 class="card-title mb-4">
                    Configuration du site
                </h1>

                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}

                    {% crispy form %}
                </form>

            </div>
        </div>
    </div>
</div>

{% endblock %}
