{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verger Infini</title>
    <link rel="stylesheet" href="{% static 'minigame/css/game.css' %}">
</head>
<body>
    <div class="game">
        <header class="game-header">
            <a class="back-link" href="{% url 'forum:index' %}">← Retour au site</a>
            <h1 class="brand">Verger Infini</h1>
            <p class="tagline">Récolte des pommes, plante des variétés, élargis ton verger.</p>
        </header>

        <section class="play-area" aria-label="Zone de jeu">
            <div class="stats">
                <div class="stat">
                    <span class="stat-label">Pommes</span>
                    <span id="apples" class="stat-value">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Par clic</span>
                    <span id="per-click" class="stat-value">1</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Par seconde</span>
                    <span id="per-second" class="stat-value">0</span>
                </div>
            </div>

            <button type="button" id="tree-btn" class="tree-btn" aria-label="Cueillir une pomme">
                <svg class="tree-svg" viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <ellipse cx="100" cy="220" rx="48" ry="10" fill="rgba(0,0,0,0.12)"/>
                    <rect x="90" y="150" width="20" height="70" rx="4" fill="#6b4423"/>
                    <circle cx="100" cy="120" r="58" fill="#3d7a2a"/>
                    <circle cx="68" cy="100" r="36" fill="#4a9634"/>
                    <circle cx="132" cy="100" r="36" fill="#4a9634"/>
                    <circle cx="100" cy="72" r="40" fill="#5aad3f"/>
                    <!-- pommes -->
                    <circle cx="72" cy="108" r="9" fill="#c0392b"/>
                    <ellipse cx="72" cy="100" rx="2" ry="3" fill="#2d5a1e"/>
                    <circle cx="118" cy="95" r="8" fill="#e74c3c"/>
                    <ellipse cx="118" cy="88" rx="2" ry="3" fill="#2d5a1e"/>
                    <circle cx="95" cy="78" r="7" fill="#d63031"/>
                    <ellipse cx="95" cy="72" rx="1.5" ry="2.5" fill="#2d5a1e"/>
                    <circle cx="135" cy="125" r="8" fill="#c0392b"/>
                    <ellipse cx="135" cy="118" rx="2" ry="3" fill="#2d5a1e"/>
                    <circle cx="78" cy="140" r="7" fill="#e67e22"/>
                    <ellipse cx="78" cy="134" rx="1.5" ry="2.5" fill="#2d5a1e"/>
                </svg>
                <span class="click-hint">Cueillir !</span>
            </button>
            <div id="floating-layer" class="floating-layer" aria-hidden="true"></div>
        </section>

        <aside class="shop" aria-label="Boutique du verger">
            <div class="shop-header">
                <h2>Boutique</h2>
                <button type="button" id="reset-btn" class="reset-btn" title="Réinitialiser la sauvegarde">Reset</button>
            </div>
            <ul id="shop-list" class="shop-list"></ul>
        </aside>
    </div>

    <script src="{% static 'minigame/js/game.js' %}"></script>
</body>
</html>
