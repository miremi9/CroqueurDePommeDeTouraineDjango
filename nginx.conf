events {}

http {
    client_max_body_size 100M;

    server {
        listen 80;
        server_name croqueurs-de-pommes-de-touraine.fr;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name croqueurs-de-pommes-de-touraine.fr;

        ssl_certificate /etc/letsencrypt/live/croqueurs-de-pommes-de-touraine.fr/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/croqueurs-de-pommes-de-touraine.fr/privkey.pem;

        location /static/ {
            alias /app/staticfiles/;
        }

        location /media/ {
            alias /app/uploads/;
        }

        location / {
            proxy_pass http://backend:8000;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
