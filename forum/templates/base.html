{% load static %}
{% load crispy_forms_tags %}

<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% if site_body.logo %}
        <link rel="icon" type="image/x-icon" href="{{ site_body.logo.url }}">
    {% endif %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'forum/css/base.css' %}">
    <link rel="stylesheet" href="{% static 'forum/css/header.css' %}">
    <link rel="stylesheet" href="{% static 'forum/css/section.css' %}">
    <link rel="stylesheet" href="{% static 'forum/css/style.css' %}">
    <link rel="stylesheet" href="{% static 'forum/css/toast.css' %}">
    <link rel="stylesheet" href="{% static 'tools/css/listview.css' %}">
    <link rel="stylesheet" href="{% static 'forum/css/formcontent.css' %}">
    <style>
        {% if site_body.background_image %}
        body::before {
            background-image: url('{{ site_body.background_image.url }}');
        }
        {% endif %}
    </style>
</head>

<body class="d-flex flex-column min-vh-100">
    {% include "header.html" %}
    <main class="flex-grow-1">
        {% block content %}
        {% endblock %}
    </main>
    <footer class="bg-dark text-white py-4 mt-auto">
        <div class="container text-center">
            {{ site_body.bas_de_page|linebreaksbr }}
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script>
    document.body.addEventListener('htmx:configRequest', function (event) {
        event.detail.headers['X-CSRFToken'] =
            document.querySelector('[name=csrfmiddlewaretoken]').value;
    });

    document.addEventListener("DOMContentLoaded", function () {
    const params = new URLSearchParams(
        window.location.search
    );

    if (params.get("login") === "1") {
        const modalElement = document.getElementById(
            "loginModal"
        );
        const modal = new bootstrap.Modal(
            modalElement
        );
        modal.show();
    }

    document.querySelectorAll(".toast-container .toast").forEach(function (el) {
        bootstrap.Toast.getOrCreateInstance(el).show();
    });
});

function initPasswordToggles(root) {
    (root || document).querySelectorAll('input[type="password"]:not([data-toggle-initialized])').forEach(function (input) {
        input.setAttribute('data-toggle-initialized', 'true');

        const wrapper = document.createElement('div');
        wrapper.className = 'input-group';
        input.parentNode.insertBefore(wrapper, input);
        wrapper.appendChild(input);
        input.classList.add('border-end-0');

        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'btn btn-outline-secondary';
        button.setAttribute('aria-label', 'Afficher le mot de passe');
        button.innerHTML = '<i class="bi bi-eye"></i>';

        button.addEventListener('click', function () {
            const showing = input.type === 'text';
            input.type = showing ? 'password' : 'text';
            button.innerHTML = showing
                ? '<i class="bi bi-eye"></i>'
                : '<i class="bi bi-eye-slash"></i>';
            button.setAttribute(
                'aria-label',
                showing ? 'Afficher le mot de passe' : 'Masquer le mot de passe'
            );
        });

        wrapper.appendChild(button);
    });
}

document.addEventListener('DOMContentLoaded', function () {
    initPasswordToggles();
});

document.body.addEventListener('htmx:afterSettle', function (event) {
    initPasswordToggles(event.target);
});
    </script>
{% include "forum/login_modal.html" %}

{% if messages %}
    {% include "toast_message.html" %}
{% endif %}
</body>


</html>
