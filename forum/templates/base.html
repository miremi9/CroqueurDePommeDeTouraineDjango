{% load static %}
{% load crispy_forms_tags %}

<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'forum/css/base.css' %}">
    <link rel="stylesheet" href="{% static 'forum/css/header.css' %}">
    <link rel="stylesheet" href="{% static 'forum/css/section.css' %}">
    <link rel="stylesheet" href="{% static 'forum/css/style.css' %}">
    <link rel="stylesheet" href="{% static 'tools/css/listview.css' %}">
    <link rel="stylesheet" href="{% static 'forum/css/formcontent.css' %}">
    <style>
        body {
        {% if site_body.background_image %}
            background-image: url('{{ site_body.background_image.url }}');
        {% endif %}
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
    </style>
</head>

<body class="d-flex flex-column min-vh-100">
    {% include "header.html" %}
    <main class="flex-grow-1">
        {% block content %}
        {% endblock %}
    </main>
    <footer class="bg-dark text-white py-4 mt-auto">
        <div class="container text-center">
            {{ site_body.bas_de_page|linebreaksbr }}
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script>
    document.body.addEventListener('htmx:configRequest', function (event) {
        event.detail.headers['X-CSRFToken'] =
            document.querySelector('[name=csrfmiddlewaretoken]').value;
    });

    document.addEventListener("DOMContentLoaded", function () {
    const params = new URLSearchParams(
        window.location.search
    );

    if (params.get("login") === "1") {
        const modalElement = document.getElementById(
            "loginModal"
        );
        const modal = new bootstrap.Modal(
            modalElement
        );
        modal.show();
    }

});
    </script>

</body>
<div
    class="modal fade"
    id="loginModal"
    tabindex="-1"
    aria-hidden="true"
>
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">
                    Se connecter
                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                ></button>
            </div>

            <div class="modal-body">
                <form
                    method="post"
                    action="{% url 'users:login' %}">
                    {% csrf_token %}
                    {% crispy login_form %}

                    <button
                        type="submit"
                        class="btn btn-primary">
                        Se connecter
                    </button>
                </form>

                <a href="{% url 'users:password_reset' %}">
                    Mot de passe oublié ?
                </a>

            </div>

        </div>
    </div>
</div>


</html>
