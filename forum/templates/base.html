{% load static %}

<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'forum/css/base.css' %}">
    <link rel="stylesheet" href="{% static 'forum/css/header.css' %}">
    <link rel="stylesheet" href="{% static 'forum/css/section.css' %}">
    <link rel="stylesheet" href="{% static 'forum/css/style.css' %}">
    <style>
        body {
        {% if site_body.background_image %}
            background-image: url('{{ site_body.background_image.url }}');
        {% endif %}
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
    </style>
</head>

<body>
    {% include "header.html" %}
    {% block content %}
    {% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script>
    document.body.addEventListener('htmx:configRequest', function (event) {
        event.detail.headers['X-CSRFToken'] =
            document.querySelector('[name=csrfmiddlewaretoken]').value;
    });
    </script>

</body>
</html>
