{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}
<div class="container justify-content-center bg-white p-4 rounded shadow w-100">
    <h1>Choisir un nouveau mot de passe</h1>

    {% if validlink %}

    <form method="post">
        {% csrf_token %}

        {{ form|crispy }}

        <button
                type="submit"
                class="btn btn-primary"
        >
            Modifier le mot de passe
        </button>
    </form>

    {% else %}

    <p>
        Ce lien de récupération est invalide ou a déjà été utilisé.
    </p>

    {% endif %}
</div>
{%endblock %}
