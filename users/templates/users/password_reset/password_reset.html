{% load crispy_forms_tags %}

<h1>Mot de passe oublié</h1>

<p>
    Saisissez votre adresse email pour recevoir un lien de récupération.
</p>

<form method="post">
    {% csrf_token %}

    {{ form|crispy }}

    <button
            type="submit"
            class="btn btn-primary"
    >
        Envoyer le lien
    </button>
</form>
