{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}
<div class="container justify-content-center bg-white p-4 rounded shadow w-100">
    <h1>Mot de passe oublié</h1>

    <p>
        Saisissez votre adresse email pour recevoir un lien de récupération.
    </p>

    <form method="post">
        {% csrf_token %}

        {{ form|crispy }}

        <button
                type="submit"
                class="btn btn-primary"
        >
            Envoyer le lien
        </button>
    </form>
    {% endblock %}
</div>
