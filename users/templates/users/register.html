{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}

<div class="container card text-center">

    <h2>Créer un compte</h2>

    <form method="post">
        {% csrf_token %}
        {% crispy form %}

        <button class="btn btn-primary">
            S'inscrire
        </button>

    </form>
</div>

{% endblock %}
