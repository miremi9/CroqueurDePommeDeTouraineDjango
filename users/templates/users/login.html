{% extends "base.html" %}

{% block content %}

<div class="container">
    <h2>Connexion</h2>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}
        <a href="{% url 'users:password_reset' %}">
            Mot de passe oublié ?
        </a>
        <button class="btn btn-primary">
            Se connecter
        </button>
    </form>
</div>

{% endblock %}
